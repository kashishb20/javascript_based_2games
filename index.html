<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Games</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 45px;
            color: #dcdcdc;
        }

        .games {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .game-card {
            width: 300px;
            min-height: 220px;

            background: white;
            color: #222;

            border-radius: 20px;
            padding: 35px 25px;

            text-decoration: none;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
        }

        .game-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .game-card h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .game-card p {
            font-size: 16px;
            color: #666;
        }

        .play {
            margin-top: 20px;
            padding: 10px 25px;

            background: #222;
            color: white;

            border-radius: 25px;

            font-size: 16px;
        }

        footer {
            margin-top: 50px;
            color: #bdbdbd;
            font-size: 14px;
        }

        @media (max-width: 650px) {

            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 17px;
            }

            .game-card {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎮 JavaScript Games</h1>

        <p class="subtitle">
            Choose a game and start playing!
        </p>

        <div class="games">

            <!-- Tic Tac Toe -->
            <a href="tictac_/index.html" class="game-card">

                <div class="game-icon">
                    ❌⭕
                </div>

                <h2>Tic Tac Toe</h2>

                <p>
                    Challenge yourself in the classic
                    Tic Tac Toe game.
                </p>

                <div class="play">
                    ▶ Play Game
                </div>

            </a>


            <!-- Rock Paper Scissors -->
            <a href="game_/index1.html" class="game-card">

                <div class="game-icon">
                    ✊✋✌️
                </div>

                <h2>Rock Paper Scissors</h2>

                <p>
                    Choose your move and compete
                    against the computer.
                </p>

                <div class="play">
                    ▶ Play Game
                </div>

            </a>

        </div>

        <footer>
            <p>Made with HTML, CSS & JavaScript</p>
        </footer>

    </div>

</body>

</html>
